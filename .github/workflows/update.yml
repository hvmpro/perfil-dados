name: Atualizar perfil

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Buscar dados do GitHub
        run: |
          curl -s https://api.github.com/users/hvmpro > perfil.json
          curl -s https://api.github.com/users/hvmpro/repos > repos.json

      - name: Verificar arquivos
        run: |
          cat perfil.json
          cat repos.json

      - name: Commit e push
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "update dados" || echo "sem mudanças"
          git push
